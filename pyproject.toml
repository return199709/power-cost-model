[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcop"
version = "0.0.1"
description = "Delivered Cost of Power model: grid vs behind-the-meter gas, per site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dcop = "dcop.cli:main"

[tool.setuptools.packages.find]
include = ["dcop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
