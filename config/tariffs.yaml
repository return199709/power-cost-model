# ---------------------------------------------------------------------------
# Austin Energy FY2026, Large General (primary voltage) and Transmission
# schedules, inside city limits. Rates from the tariff PDF: p.10-14 (primary),
# p.16-18 (transmission), PSA p.21, administrative adjustment p.23, CBC p.24-25,
# regulatory charge p.26. High-load-factor (HLF) schedules need a multi-year
# contract with an exclusive-supplier clause and an 85% annual average monthly
# load factor. HLF Community Benefit: only the Customer Assistance Program
# applies, capped at $200,000 per calendar year. The text on p.11 says Service
# Area Lighting also applies to the 3-20 MW HLF schedule, but its rate table and
# the CBC table on p.24-25 show none; the tables are followed here.
# Not modeled: Dual Feed Service charges, block power supply pricing, GreenChoice,
# the Load Shifting Voltage Discount Rider, the 20% public-entity discount, and
# the 1% monthly late-payment penalty.
# ---------------------------------------------------------------------------
